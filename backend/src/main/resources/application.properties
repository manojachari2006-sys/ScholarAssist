spring.application.name=scholarassist

# Use a separate local port by default so an existing backend on 8080 is left untouched.
# Override this with SERVER_PORT when a different port is needed.
server.port=${SERVER_PORT:8082}

# ===============================
# DATABASE
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/scholarassist
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true

# Local document storage (keep uploads outside the database).
scholarassist.upload-dir=uploads
scholarassist.max-upload-bytes=10485760
scholarassist.email.enabled=${SCHOLARASSIST_EMAIL_ENABLED:false}
scholarassist.email.from=${SCHOLARASSIST_EMAIL_FROM:ScholarAssist <no-reply@localhost>}
scholarassist.email.frontend-url=${SCHOLARASSIST_FRONTEND_URL:http://localhost:5500}
scholarassist.email.poll-interval-ms=${SCHOLARASSIST_EMAIL_POLL_INTERVAL_MS:30000}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
